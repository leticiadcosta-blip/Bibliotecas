<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
       
        <header class="page-header">
            <h1><i class="fa-solid fa-book-open"></i> Biblioteca Virtual</h1>
            <p>Gerencie e cadastre os livros do seu sistema de forma simples e rápida.</p>
        </header>

   
        <section class="card">
            <h2>Cadastro de Livros</h2>
            <p class="form-subtitle">Preencha os dados abaixo para cadastrar um novo livro no sistema.</p>
            
            <form>
                <div class="form-grid">
                    <div class="input-group">
                        <label for="id">ID *</label>
                        <input type="text" id="id" placeholder="Ex: 04" required>
                    </div>

                    <div class="input-group">
                        <label for="autor">Autor *</label>
                        <input type="text" id="autor" placeholder="Nome do autor" required>
                    </div>

                    <div class="input-group">
                        <label for="titulo">Título *</label>
                        <input type="text" id="titulo" placeholder="Título do livro" required>
                    </div>

                    <div class="input-group">
                        <label for="ano">Ano de Publicação *</label>
                        <input type="text" id="ano" placeholder="Ex: 2023" required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">
                        <i class="fa-solid fa-floppy-disk"></i> Salvar Livro
                    </button>
                </div>
            </form>
        </section>
    </div>

</body>
</html>
